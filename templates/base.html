<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Treino App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topo">
    <h1>Treino em Casa</h1>
    <nav class="menu">
      <a href="{{ url_for('index') }}">Registrar</a>
      <a href="{{ url_for('historico') }}">Histórico</a>
      <a href="{{ url_for('musculos') }}">Músculos</a>
      <a href="{{ url_for('novo_exercicio') }}">Novo Exercício</a>
    </nav>
  </header>

  <main class="container">
    {% with mensagens = get_flashed_messages() %}
      {% if mensagens %}
        <div class="alertas">
          {% for msg in mensagens %}
            <p>{{ msg }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
