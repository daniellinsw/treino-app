{% extends "base.html" %}
{% block title %}Editar Registro - Treino App{% endblock %}

{% block content %}
<section class="card">
  <h2>Editar série</h2>
  <form method="POST" class="form-treino">
    <label for="data_treino">Data</label>
    <input type="date" id="data_treino" name="data_treino" value="{{ registro.data_treino }}" required />

    <label for="exercicio_id">Exercício</label>
    <select id="exercicio_id" name="exercicio_id" required>
      {% for ex in exercicios %}
        <option value="{{ ex.id }}" {% if ex.id == registro.exercicio_id %}selected{% endif %}>
          {{ ex.nome }} ({{ ex.equipamento }})
        </option>
      {% endfor %}
    </select>

    <div class="linha-dupla">
      <div>
        <label for="serie">Série nº</label>
        <input type="number" id="serie" name="serie" min="1" value="{{ registro.serie }}" required />
      </div>
      <div>
        <label for="repeticoes">Repetições</label>
        <input type="number" id="repeticoes" name="repeticoes" min="1" value="{{ registro.repeticoes }}" required />
      </div>
    </div>

    <label for="observacao">Observação</label>
    <input type="text" id="observacao" name="observacao" value="{{ registro.observacao }}" />

    <button type="submit" class="btn">Salvar alterações</button>
    <a href="{{ url_for('historico') }}" class="btn btn-secundario">Cancelar</a>
  </form>
</section>
{% endblock %}
